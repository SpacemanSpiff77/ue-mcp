    class_path: ue-mcp.bridge
    group: widget
    description: "Remove designer binding(s) matching widgetName (and optional propertyName) from a WidgetBlueprint without opening the editor. Idempotent (#530). Params: assetPath, widgetName, propertyName?"
    options:
      method: clear_widget_binding
  widget.set_property:
    class_path: ue-mcp.bridge
    group: widget
    description: "Set widget property. Slot struct props take UE struct text that persists every field - `Slot.Size`=`(Value=1.0,SizeRule=Fill)`, `Slot.Padding`=`(Left=8,Top=8,Right=8,Bottom=8)` - or a nested field path like `Slot.Size.Value` / `Slot.Padding.Left`; an invalid value errors instead of silently writing 0 (#532). Params: assetPath, widgetName, propertyName, value"
    options:
      method: set_widget_property
  widget.set_style:
    class_path: ue-mcp.bridge
    group: widget
    description: "Set a full/nested style struct on a widget from JSON (FButtonStyle, FEditableTextBoxStyle, FSlateFontInfo, FSlateColor and their nested brushes) - what set_property's scalar path can't express. value is a JSON object mirroring the struct. Params: assetPath, widgetName, propertyName (e.g. WidgetStyle), value (#563)"
    options:
      method: set_widget_style
  widget.reorder_child:
    class_path: ue-mcp.bridge
    group: widget
    description: "Reorder a widget among its parent panel's children (move to a sibling index) - e.g. insert a new row BETWEEN two existing children. move_widget only reparents. Params: assetPath, widgetName, index (#635)"
    options:
      method: reorder_child
  widget.bulk_set_properties:
    class_path: ue-mcp.bridge
    group: widget
    description: "Apply many {widgetName, propertyName, value} style/property writes to a WidgetBlueprint in one call (single compile+save) - font/color/style stylesheet across many widgets. Params: assetPath, properties[] (#563)"
    options:
      method: bulk_set_widget_properties
  widget.list:
