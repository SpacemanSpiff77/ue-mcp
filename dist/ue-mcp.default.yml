    options:
      method: build_geometry
  editor.build_hlod:
    class_path: ue-mcp.bridge
    group: editor
    description: Build HLODs
    options:
      method: build_hlod
  editor.validate_assets:
    class_path: ue-mcp.bridge
    group: editor
    description: "Run data validation. Params: directory?"
    options:
      method: validate_assets
  editor.get_build_status:
    class_path: ue-mcp.bridge
    group: editor
    description: Get build/map status
    options:
      method: get_build_status
  editor.cook_content:
    class_path: ue-mcp.bridge
    group: editor
    description: "Cook content. Params: platform?"
    options:
      method: cook_content
  editor.get_log:
    class_path: ue-mcp.bridge
    group: editor
    description: "Read output log. Params: maxLines?, filter?, category?"
    options:
      method: get_output_log
  editor.search_log:
    class_path: ue-mcp.bridge
    group: editor
    description: "Search log. Params: query"
    options:
      method: search_log
  editor.get_message_log:
    class_path: ue-mcp.bridge
    group: editor
    description: "Read a Message Log listing (MapCheck, AssetCheck, PIE, LoadErrors, LightingResults...). Call with NO logName to list the registered listings with their error/warning counts, then read one. Counts come from the listing itself; message bodies come from the current page and honour the Message Log tab's severity checkboxes, so when fewer are readable than exist the response says so instead of reading clean. An unknown logName is an error, not an empty log. Blueprint COMPILE results are not here - the compiler makes a listing per Blueprint; use blueprint(compile). Params: logName?, maxLines? (default 200), severity? (severity-name substring)"
    options:
      method: get_message_log
  editor.list_crashes:
    class_path: ue-mcp.bridge
