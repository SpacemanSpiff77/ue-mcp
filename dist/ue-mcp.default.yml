    options:
      method: remove_widget
  widget.move_widget:
    class_path: ue-mcp.bridge
    group: widget
    description: "Reparent widget. Params: assetPath, widgetName, newParentWidgetName"
    options:
      method: move_widget
  widget.set_root:
    class_path: ue-mcp.bridge
    group: widget
    description: "Replace WBP root with an existing widget by name (#365). Params: assetPath, widgetName"
    options:
      method: set_root_widget
  widget.wrap_root:
    class_path: ue-mcp.bridge
    group: widget
    description: "Wrap the current root in a new panel widget (UMG 'Wrap With'). Params: assetPath, wrapperClass (must be a UPanelWidget subclass), wrapperName? (#365)"
    options:
      method: wrap_root_widget
  widget.list_classes:
    class_path: ue-mcp.bridge
    group: widget
    description: List available widget classes
    options:
      method: list_widget_classes
  widget.list_runtime:
    class_path: ue-mcp.bridge
    group: widget
    description: "(#160) List live UUserWidget instances in the PIE world. Params: classFilter?, namePrefix?, viewportOnly?"
    options:
      method: list_runtime_widgets
  widget.get_runtime:
    class_path: ue-mcp.bridge
    group: widget
    description: "(#160) Inspect a live PIE widget tree with text/visibility/brush/percent plus style values: renderOpacity (all), colorAndOpacity (TextBlock/Image), Border brushColor/contentColorAndOpacity (#592). Params: widgetName? | className?, childName?, maxDepth?"
    options:
      method: get_runtime_widget
  widget.get_runtime_delegates:
    class_path: ue-mcp.bridge
    group: widget
    description: "(#161) Read delegate binding state on a live PIE widget. Params: widgetName, className?. Returns array of {delegateName, isBound, numBindings}"
    options:
      method: get_runtime_delegates
  widget.add_to_viewport:
    class_path: ue-mcp.bridge
    group: widget
    description: "(#602) Instantiate a WidgetBlueprint and add it to the live PIE viewport for visual verification. Requires PIE running. Params: assetPath (WidgetBlueprint path), zOrder?"
    options:
      method: add_to_viewport
  widget.invoke_runtime_function:
    class_path: ue-mcp.bridge
    group: widget
    description: "(#559) Fire a UI interaction on a live PIE widget: a parameterless UFUNCTION (functionName) on the located UserWidget, OR a button click via childName (broadcasts the child UButton's OnClicked). Locate the widget with widgetName or className. Params: widgetName?|className?, functionName?, childName?"
    options:
      method: invoke_runtime_function

  # ── editor ──
  editor.start_editor:
    class_path: editor.start_editor
    group: editor
    description: "Launch Unreal Editor with the current project and reconnect bridge. Waits for the bridge on the project's actual published port, not a fixed default. Params: timeout? (seconds, default 120) (#758)"
  editor.stop_editor:
    class_path: editor.stop_editor
    group: editor
    description: Close Unreal Editor gracefully (asks the editor to quit itself via the bridge; never an OS kill)
  editor.restart_editor:
    class_path: editor.restart_editor
    group: editor
    description: Stop then start the editor
  editor.build_project:
    class_path: editor.build_project
    group: editor
    description: "Build the project's C++ code using Unreal Build Tool. Editor should be stopped first."
  editor.execute_command:
    class_path: ue-mcp.bridge
    group: editor
    description: "Run console command. Params: command"
    options:
      method: execute_command
  editor.execute_python:
    class_path: editor.execute_python
    group: editor
    description: "GATED LAST RESORT. execute_python is unreachable until a semantic tool search over your taskSummary has been run AND every candidate it returns is EXPLICITLY ruled out with a stated reason. Flow: (1) call with taskSummary (+code) - it returns the candidate actions; (2) re-call with the same taskSummary/code PLUS ruledOut=[{action, reason}] giving a specific reason each candidate does not fit. Python runs only once every candidate is ruled out. Params: code, taskSummary (required), ruledOut?, resultVariable? (name of a top-level variable to return as `result`, separate from print()/log; #732) (#704)"
  editor.run_python_file:
    class_path: ue-mcp.bridge
    group: editor
    description: "Run a Python file from disk with __file__/__name__ populated (#142). Params: filePath, args?, resultVariable? (name of a top-level variable to return as `result`, separate from logs; #732)"
    options:
      method: run_python_file
  editor.purge_python_modules:
    class_path: ue-mcp.bridge
    group: editor
    description: "Purge cached embedded-Python modules whose name starts with a prefix, so the editor drops stale code after you edit a Python tool on disk. Returns the purged module names + count. Params: prefix (required, non-empty) (#719)"
    options:
      method: purge_python_modules
  editor.close_sequence:
    class_path: ue-mcp.bridge
    group: editor
    description: "Close the currently open Level Sequence editor (Sequencer). Do this before bulk-deleting actors a sequence may possess - open sequences re-resolve possessables by name during destruction and can mis-bind. Returns wasOpen + closedSequence (#718)"
    options:
      method: close_sequence
  editor.open_tab:
    class_path: ue-mcp.bridge
    group: editor
    description: "Open a registered editor tab by ID so its UI can be screenshotted as evidence (e.g. 'ProjectSettings', 'OutputLog', 'ContentBrowserTab1'). Params: tabId (#727)"
    options:
      method: open_tab
  editor.open_settings:
    class_path: ue-mcp.bridge
    group: editor
    description: "Open (and navigate) a settings viewer for visual settings evidence. Params: container? (Project|Editor; default Project), category? (e.g. 'Engine'), section? (e.g. 'Physics', or a combined 'Engine.Physics') (#727)"
    options:
      method: open_settings
  editor.set_property:
    class_path: ue-mcp.bridge
    group: editor
    description: "Set UObject property. Saves the package to disk by default; pass save=false to leave it dirty in-memory (batch many writes, then editor(save_dirty)/asset(save)) (#674). Params: objectPath, propertyName, value, save? (default true)"
    options:
      method: set_property
  editor.get_property:
    class_path: ue-mcp.bridge
    group: editor
    description: "Read UObject property. Params: objectPath, propertyName"
    options:
      method: get_property
  editor.describe_object:
    class_path: ue-mcp.bridge
    group: editor
    description: "Describe a UObject and optionally list/read properties. Params: objectPath, includeProperties?, includeValues?, propertyNames?"
    options:
      method: describe_object
  editor.play_in_editor:
    class_path: ue-mcp.bridge
    group: editor
    description: "PIE control. Params: pieAction (start|stop|status), waitForAssetRegistry? (start only; default true - block until the AssetRegistry initial scan completes before requesting PIE, otherwise PIE silently no-ops on cold editor starts), assetRegistryTimeoutSeconds? (default 180) (#406)"
    options:
      method: pie_control
  editor.get_runtime_value:
    class_path: ue-mcp.bridge
    group: editor
    description: "Read PIE actor property. Params: actorLabel, propertyName (supports dotted paths: component.field or component.struct.field for nested reads on component subobjects, #344/#381)"
    options:
      method: get_runtime_value
  editor.get_pie_pawn:
    class_path: ue-mcp.bridge
    group: editor
    description: "Resolve the controlled pawn in the active PIE world. Params: playerIndex? (default 0). Returns actorLabel/class/location/rotation (#228/#229)"
    options:
      method: get_pie_pawn
  editor.list_pie_instances:
    class_path: ue-mcp.bridge
    group: editor
    description: "List the running PIE worlds with their instance id, net mode (standalone|listenServer|dedicatedServer|client), player count and whether they own a game viewport. In a multiplayer PIE session every other runtime action resolves the primary world (the server) unless you pass pieInstance, so this is how you discover that a client exists and what id addresses it. Params: none (#778)"
    options:
      method: list_pie_instances
  editor.invoke_object_function:
    class_path: ue-mcp.bridge
    group: editor
    description: "Call a UFUNCTION on any UObject, not just a placed actor. Target it with objectPath, or target=gameinstance|gamemode|gamestate|playercontroller|playerpawn|subsystem (subsystem also needs subsystemClass; playercontroller/playerpawn accept playerIndex). The GameInstance, GameMode and subsystems have no actor label, so invoke_function could never reach them. Returns output and return params under returnValues; an unknown function name lists the available ones. Params: functionName, objectPath? | target?, subsystemClass?, playerIndex?, args?, world? (editor|pie|auto), pieInstance? (#739)"
    options:
      method: invoke_object_function
  editor.get_object_properties:
    class_path: ue-mcp.bridge
    group: editor
    description: "Read reflected properties off any UObject, with the same targeting as invoke_object_function. Pass propertyNames to filter; names that do not exist come back under missingProperties instead of silently returning nothing. Params: objectPath? | target?, subsystemClass?, playerIndex?, propertyNames?, world? (editor|pie|auto), pieInstance? (#739)"
    options:
      method: get_object_properties
  editor.read_bone_transforms:
    class_path: ue-mcp.bridge
    group: editor
    description: "Read live skeletal bone and socket transforms off an actor, once. This is a point-in-time read, NOT a time series - for per-frame capture over a window use the pie category's observe actions. Pass bones (bone OR socket names) or omit for every bone up to limit. space=world (default) or component; component space is independent of where the actor is standing. Also reports the AnimInstance class/path. Params: actorLabel, componentName?, bones?, space?, limit?, world? (editor|pie|auto), pieInstance? (#756/#757/#761/#764)"
    options:
      method: read_bone_transforms
  editor.set_movement_mode:
    class_path: ue-mcp.bridge
    group: editor
    description: "Set a live PIE character's movement mode and/or velocity on its CharacterMovementComponent. Modes are named (none|walking|navwalking|falling|swimming|flying|custom) rather than raw enum numbers, because a wrong number reads as success and then behaves as None. Reports previousMode/previousVelocity and reads the mode back afterwards, since SetMovementMode can refuse a mode the character cannot enter (flying with bCanFly off, swimming outside a volume). Params: actorLabel, mode?, customMode? (only with mode='custom'), velocity? {x,y,z}, world? (default pie), pieInstance? (#757)"
    options:
      method: set_movement_mode
  editor.teleport_runtime_actor:
    class_path: ue-mcp.bridge
    group: editor
    description: "Move a live PIE actor and have it STAY moved. A plain SetActorLocation on a Character is undone by CharacterMovement on the next tick, so this stops the movement component, teleports, and stops it again. Reports actualLocation read back from the actor rather than what was requested. Params: actorLabel, location?, rotation?, stopMovement? (default true), sweep? (default false), world? (default pie), pieInstance? (#770/#777)"
    options:
      method: teleport_runtime_actor
  editor.invoke_function:
    class_path: ue-mcp.bridge
    group: editor
    description: "Call a BlueprintCallable / Exec UFUNCTION on a target actor or one of its components. Params: actorLabel, functionName, component? (component subobject name; redirects target from the actor to that component, #382), args? (object), actorArgs? (object mapping UObject* parameter name to actor label, resolved against live actors in the active world; #383), world? (editor|pie). Returns out/return params (#228/#229)"
    options:
      method: invoke_function
  editor.invoke_static_function:
    class_path: ue-mcp.bridge
    group: editor
    description: "Call a static UFUNCTION on a UBlueprintFunctionLibrary (no actor instance). invoke_function needs an actor/component target; this targets the library class CDO instead, so it reaches static *_BlueprintOnly libraries (Voxel sculpt/query/stamp), GeometryScript, Kismet math, any function library. Params: className (short name or /Script/Module.Class path), functionName, args? (name -> JSON value, same marshalling as invoke_function), actorArgs? (name -> actor label for UObject* params that are actors, e.g. the sculpt actor), worldContextParam? (name of a UObject* param to fill with the editor/PIE world; auto-detected for params named WorldContextObject), world? (editor|pie). Returns return/out params under returnValues. Discover libraries + functions with list_function_libraries."
    options:
      method: invoke_static_function
  editor.list_function_libraries:
    class_path: ue-mcp.bridge
    group: editor
    description: "Enumerate UBlueprintFunctionLibrary subclasses on this build. Filter by name (case-insensitive substring, e.g. 'GeometryScript' / 'Kismet' / 'Animation'). Returns name, module, and (by default) every static BlueprintCallable function on the library with its tooltip. Use to discover what's available for editor.invoke_function (#455). Params: pattern?, includeFunctions?"
    options:
      method: list_function_libraries
  editor.set_pie_time_scale:
    class_path: ue-mcp.bridge
    group: editor
    description: "Fast-forward PIE game time. Params: factor (>0). Raises WorldSettings caps and calls SetGlobalTimeDilation."
    options:
      method: set_pie_time_scale
  editor.hot_reload:
    class_path: ue-mcp.bridge
    group: editor
    description: Hot reload C++
    options:
      method: hot_reload
  editor.undo:
    class_path: ue-mcp.bridge
    group: editor
    description: Undo last transaction
    options:
      method: undo
  editor.redo:
    class_path: ue-mcp.bridge
    group: editor
    description: Redo last transaction
    options:
      method: redo
  editor.get_perf_stats:
    class_path: ue-mcp.bridge
    group: editor
    description: Editor performance stats
    options:
      method: get_editor_performance_stats
  editor.run_stat:
    class_path: ue-mcp.bridge
    group: editor
    description: "Run a stat overlay. Params: name (bare stat name, e.g. 'unit','fps','game','gpu') OR command (full console command). A bare name is prefixed with 'stat ' (#722)."
    options:
      method: run_stat_command
  editor.set_scalability:
    class_path: ue-mcp.bridge
    group: editor
    description: "Set rendering quality via the Scalability system (actually applies + persists, not just sg.* cvars). Params: level (Low|Medium|High|Epic|Cinematic). Returns appliedLevels (#591)"
    options:
      method: set_scalability
  editor.set_cvars:
    class_path: ue-mcp.bridge
    group: editor
    description: "Bulk-set console variables. Params: cvars ({name: value} object OR [{name, value}] array). Returns per-cvar old/new values and any notFound names (#591)"
    options:
      method: set_cvars
  editor.capture_screenshot:
    class_path: ue-mcp.bridge
    group: editor
    description: "Screenshot. target=pie captures the actual PIE game viewport with UI + on-screen debug canvas (what the player sees), even in Play-in-New-Window; target=editor captures the level viewport; target=window synchronously captures the whole active Slate window via FSlateApplication::TakeScreenshot - pixel-true for ALL Slate/UMG UI (painted widgets the compositing paths can miss), returns after the PNG is written, and works while the window is unfocused or off-screen, so it is the reliable mode for agent visual QA of game UI. Params: filename?, resolution?, target? (auto|pie|editor|window; auto routes to PIE when running). Returns includesDebugCanvas (#226/#724), and window title + width/height for target=window"
    options:
      method: capture_screenshot
  editor.capture_scene_png:
    class_path: ue-mcp.bridge
    group: editor
    description: "Headless PNG screenshot via SceneCapture2D (works unfocused, guaranteed RGBA8 LDR). focusActorLabel auto-frames the camera on an actor's bounds; world:pie captures the running game world (#599). Params: outputPath, location?, rotation?, focusActorLabel?, focusDirection?, focusMargin?, world? (editor|pie), width? (default 1280), height? (default 720), fov? (default 90) (#148/#599)"
    options:
      method: capture_scene_png
  editor.set_realtime:
    class_path: ue-mcp.bridge
    group: editor
    description: "Toggle realtime update on the level editor viewports so the editor-world sim (Niagara, anims) ticks - otherwise capture_scene_png renders an unticked, empty sim. Params: enabled (default true) (#537)"
    options:
      method: set_realtime
  editor.get_viewport:
    class_path: ue-mcp.bridge
    group: editor
    description: Get viewport camera
    options:
      method: get_viewport_info
  editor.hit_test_viewport_pixel:
    class_path: ue-mcp.bridge
    group: editor
    description: "Ray-cast from a screen pixel through the active editor viewport and return the first hit. Builds the ray from the live viewport's projection matrix (no FOV/aspect guessing). Returns hit + actorLabel/actorClass/componentName/componentClass/materialPath/location/impactPoint/normal/distance/faceIndex/boneName/physicalMaterial. Params: x, y (pixel coords), width? height? (override viewport size when picking from a different-resolution screenshot), maxDistance? (default 200000), ignoreActors? (array of actor labels) (#418)"
    options:
      method: hit_test_viewport_pixel
  editor.get_runtime_values:
    class_path: ue-mcp.bridge
    group: editor
    description: "Bulk runtime read across the active world. For each actor/component matching classFilter, resolves every path against the (actor|component) root and returns rows of {actorLabel, actorClass, componentName?, componentClass?, values, errors?}. Paths support property hops, sub-object hops, and zero-arg BlueprintCallable getter calls at any segment (e.g. 'PowerConnector.GetRequired' reaches a UFUNCTION on a UObject sub-object). classFilter matches actor class OR component class - omit to match everything. World defaults to PIE if running, else editor. Params: classFilter?, paths[], world? (editor|pie) (#414)"
    options:
      method: get_runtime_values
  editor.set_viewport:
    class_path: ue-mcp.bridge
    group: editor
    description: "Set viewport camera. Params: location?, rotation?"
    options:
      method: set_viewport_camera
  editor.focus_on_actor:
    class_path: ue-mcp.bridge
    group: editor
    description: "Focus on actor. Params: actorLabel"
    options:
      method: focus_viewport_on_actor
  editor.create_sequence:
    class_path: ue-mcp.bridge
    group: editor
    description: "Create Level Sequence. Params: name, packagePath?"
    options:
      method: create_level_sequence
  editor.get_sequence_info:
    class_path: ue-mcp.bridge
    group: editor
