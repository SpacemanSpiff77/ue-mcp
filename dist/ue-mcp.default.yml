    group: networking
    description: "Replicate movement. Params: blueprintPath, replicateMovement?"
    options:
      method: set_replicate_movement
  networking.get_info:
    class_path: ue-mcp.bridge
    group: networking
    description: "Get networking info. Params: blueprintPath"
    options:
      method: get_networking_info

  # ── demo ──
  demo.step:
    class_path: ue-mcp.bridge
    group: demo
    description: "Execute demo step. Params: stepIndex?"
    options:
      method: demo_step
  demo.get_steps:
    class_path: ue-mcp.bridge
    group: demo
    description: "List every demo step up front: index, id and description, plus a count. Use this to see what the 19 steps build before running any of them. Params: none"
    options:
      method: demo_get_steps
  demo.cleanup:
    class_path: ue-mcp.bridge
    group: demo
    description: Remove demo assets and actors. Switches editor to /Game/MCP_Home before deleting so the editor is never left on an Untitled map.
    options:
      method: demo_cleanup
  demo.go_home:
    class_path: ue-mcp.bridge
    group: demo
    description: Switch the editor to /Game/MCP_Home (creating it on first use). Use this before any operation that would leave the editor on an Untitled map.
    options:
      method: demo_go_home

  # ── feedback ──
  feedback.submit:
    class_path: feedback.submit
    group: feedback
    description: Submit feedback about a tool gap (missing action, wrong behavior, crash, or a case you had to work around). Provide a specific title and a summary; pythonWorkaround and idealTool are optional enrichment, not prerequisites. Blocks on an MCP elicitation prompt that asks the USER (not the agent) to approve or decline the exact payload before anything is posted to GitHub.

flows:

  niagara_fire:
    description: Build a fire Niagara system from scratch (spawn rate, upward velocity, HDR orange colour) and verify it emits. A 0-to-1 best-practice starting point, not a demo. Lands at /Game/VFX/Fire/NS_Fire; override name/packagePath via params.
    steps:
      1:
        task: niagara.create_emitter
        options:
          name: E_Flame
          packagePath: /Game/VFX/Fire
      2:
        task: niagara.create
        options:
          name: NS_Fire
          packagePath: /Game/VFX/Fire
      3:
        task: niagara.add_emitter
        options:
          systemPath: "${steps.2.path}"
          emitterPath: "${steps.1.path}"
      4:
        task: niagara.set_module_input
        options:
          systemPath: "${steps.2.path}"
          moduleName: SpawnRate
          inputName: SpawnRate
          value: 60
          stackContext: EmitterUpdate
      5:
        task: niagara.set_module_input
        options:
          systemPath: "${steps.2.path}"
          moduleName: AddVelocity
          inputName: Velocity
          value: 0,0,160
          stackContext: ParticleSpawn
      6:
        task: niagara.set_module_input
        options:
          systemPath: "${steps.2.path}"
          moduleName: Color
          inputName: Color
          value: 4.0,1.2,0.15,1.0
          stackContext: ParticleUpdate
      7:
        task: niagara.validate
        options:
          systemPath: "${steps.2.path}"

