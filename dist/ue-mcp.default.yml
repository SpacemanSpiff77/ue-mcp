    options:
      method: reactivate_niagara
  niagara.set_parameter:
    class_path: ue-mcp.bridge
    group: niagara
    description: "Set parameter. Params: actorLabel, parameterName, value, parameterType?"
    options:
      method: set_niagara_parameter
  niagara.create:
    class_path: ue-mcp.bridge
    group: niagara
    description: "Create system. Params: name, packagePath?"
    options:
      method: create_niagara_system
  niagara.create_emitter:
    class_path: ue-mcp.bridge
    group: niagara
    description: "Create a Niagara emitter asset. templatePath copies an existing emitter as the starting point (the content browser's create-from-template path); omit it for the default empty emitter with the standard modules and a sprite renderer. inherit=true makes it a child that tracks the template instead, which then refuses local edits to inherited modules. Params: name, packagePath?, templatePath?, inherit? (default false), onConflict?"
    options:
      method: create_niagara_emitter
  niagara.add_emitter:
    class_path: ue-mcp.bridge
    group: niagara
    description: "Add emitter to system. Params: systemPath, emitterPath"
    options:
      method: add_emitter_to_system
  niagara.remove_emitter:
    class_path: ue-mcp.bridge
    group: niagara
    description: "Remove an emitter from a system (CRUD delete). Params: systemPath, emitterName? or emitterIndex?"
    options:
      method: remove_emitter_from_system
  niagara.list_emitters:
    class_path: ue-mcp.bridge
    group: niagara
    description: "List emitters in system. Params: systemPath"
    options:
      method: list_emitters_in_system
  niagara.set_emitter_property:
    class_path: ue-mcp.bridge
    group: niagara
    description: "Set emitter property. Params: systemPath, emitterName?, propertyName, value"
    options:
      method: set_emitter_property
  niagara.list_modules:
    class_path: ue-mcp.bridge
    group: niagara
    description: "List Niagara modules. Params: directory?"
    options:
      method: list_niagara_modules
  niagara.get_emitter_info:
    class_path: ue-mcp.bridge
    group: niagara
    description: "Inspect emitter. Params: assetPath"
    options:
      method: get_emitter_info
  niagara.list_renderers:
    class_path: ue-mcp.bridge
    group: niagara
    description: "List renderers on an emitter. Params: systemPath, emitterName?, emitterIndex?"
    options:
      method: list_emitter_renderers
  niagara.add_renderer:
    class_path: ue-mcp.bridge
    group: niagara
    description: "Add renderer (sprite/mesh/ribbon or full class). Params: systemPath, rendererType, emitterName?, emitterIndex?"
    options:
      method: add_emitter_renderer
  niagara.remove_renderer:
    class_path: ue-mcp.bridge
    group: niagara
    description: "Remove renderer by index. Params: systemPath, rendererIndex, emitterName?, emitterIndex?"
    options:
      method: remove_emitter_renderer
  niagara.set_renderer_property:
    class_path: ue-mcp.bridge
    group: niagara
    description: "Set any renderer property. Bools, numbers and strings are taken directly; object properties (a sprite/mesh renderer's Material, the mesh on a mesh renderer) take an asset path and are class-checked; structs, enums, names and arrays go through the shared JSON property setter, so there is no longer a type whitelist to fall off (#783). Params: systemPath, rendererIndex, propertyName, value, emitterName?, emitterIndex?"
    options:
      method: set_renderer_property
  niagara.inspect_data_interfaces:
    class_path: ue-mcp.bridge
    group: niagara
    description: "List user-scope data interfaces. Params: systemPath"
    options:
      method: inspect_data_interface
  niagara.create_system_from_spec:
    class_path: ue-mcp.bridge
    group: niagara
    description: "Declaratively create a system + emitters. Params: name, packagePath?, emitters?:[{path}]"
    options:
      method: create_niagara_system_from_spec
  niagara.get_compiled_hlsl:
    class_path: ue-mcp.bridge
    group: niagara
    description: "Read GPU compute script info for an emitter. Params: systemPath, emitterName?, emitterIndex?"
    options:
      method: get_niagara_compiled_hlsl
  niagara.list_system_parameters:
    class_path: ue-mcp.bridge
    group: niagara
    description: "List user-exposed system parameters. Params: systemPath"
    options:
      method: list_niagara_system_parameters
  niagara.list_module_inputs:
    class_path: ue-mcp.bridge
    group: niagara
    description: "List an emitter's modules with the inputs you can actually SET - Spawn Rate, Lifetime, Colour, Sprite Size - each with its name, qualifiedName, type and a settable flag. Current values are NOT returned: the binder's value reader is not exported from NiagaraEditor, so the names and types are readable but the live value is not. Compile-time switches and enums are reported separately under switchPins; note that 'inputs' now means override-map inputs, NOT the function-call node pins it meant before (those are switchPins) (#784). Params: systemPath, emitterName?, emitterIndex?, stackContext? (ParticleSpawn|ParticleUpdate|EmitterSpawn|EmitterUpdate|all - default all), moduleName?"
    options:
      method: list_niagara_module_inputs
  niagara.set_module_input:
    class_path: ue-mcp.bridge
    group: niagara
    description: "Set a module input value. Override-map-bound inputs (the numeric/colour values that matter) are written through the stack override map, the same path the Niagara stack editor uses; others fall back to the pin default. Reports writePath ('overrideMap'|'pinDefault'). On the overrideMap path previousValue cannot be read back (NiagaraEditor does not export the binder's reader), so it reports '(unread: override map)' and NO rollback is offered - re-set the value explicitly instead. The pinDefault path reports a real previousValue and is rollback-safe (#769). value accepts a scalar, [x,y,z], {x,y,z[,w]} or {r,g,b[,a]} (alpha defaults to 1); anything the input's type cannot parse is REJECTED rather than written, including gapped component objects and non-finite numbers. Params: systemPath, moduleName, inputName, value, emitterName?, emitterIndex?, stackContext?"
    options:
      method: set_niagara_module_input
  niagara.add_module:
    class_path: ue-mcp.bridge
    group: niagara
    description: "Add a stock /Niagara/Modules script to an emitter stack (the modules that make an emitter actually do anything). Params: systemPath, moduleScript (e.g. /Niagara/Modules/Emitter/SpawnRate), stackContext (ParticleSpawn|ParticleUpdate|EmitterSpawn|EmitterUpdate), emitterName?, emitterIndex?, targetIndex? (-1 appends). Then set_module_input to tune it."
    options:
      method: add_niagara_module
  niagara.list_static_switches:
    class_path: ue-mcp.bridge
    group: niagara
    description: "List static switch inputs on a module. Params: systemPath, moduleName, emitterName?, emitterIndex?, stackContext?"
    options:
      method: list_niagara_static_switches
  niagara.set_static_switch:
    class_path: ue-mcp.bridge
    group: niagara
    description: "Set static switch value on a module's function call node. Params: systemPath, moduleName, switchName, value, emitterName?, emitterIndex?, stackContext?"
    options:
      method: set_niagara_static_switch
  niagara.create_module_from_hlsl:
    class_path: ue-mcp.bridge
    group: niagara
    description: "Create a NiagaraScript module backed by a custom HLSL node. Params: name, hlsl, packagePath?, inputs?:[{name,type}], outputs?:[{name,type}]"
    options:
      method: create_niagara_module_from_hlsl
  niagara.create_scratch_module:
    class_path: ue-mcp.bridge
    group: niagara
    description: "Create empty Niagara scratch module. Params: name, packagePath?, inputs?:[{name,type}], outputs?:[{name,type}] (#185)"
    options:
      method: create_scratch_module
  niagara.batch:
    class_path: niagara.batch
    group: niagara
    description: "Run a sequence of niagara operations against the bridge in order. Fails fast on the first error (returns results up to that point + error). Params: ops:[{action, params}] where action is any niagara subaction listed above."

  # ── audio ──
