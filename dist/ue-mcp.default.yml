    description: "Read state machine topology. Params: assetPath, stateMachineName"
    options:
      method: read_state_machine
  animation.read_anim_graph:
    class_path: ue-mcp.bridge
    group: animation
    description: "Read AnimBP AnimGraph nodes with properties & pins. Params: assetPath, graphName?"
    options:
      method: read_anim_graph
  animation.add_curve:
    class_path: ue-mcp.bridge
    group: animation
    description: "Add float curve to AnimSequence. Params: assetPath, curveName, curveType?"
    options:
      method: add_curve
  animation.set_anim_curve_keys:
    class_path: ue-mcp.bridge
    group: animation
    description: "Set float-curve key VALUES on an AnimSequence (add_curve only creates an empty named curve - it cannot set keyframe values). Adds the curve if missing, then replaces its keys. Use for authoring Distance/Speed/any float curve directly. Params: assetPath, curveName, keys ([{time, value, interp?('linear'|'constant'|'cubic')}]), interpolation? (default 'linear', applied to keys without their own interp) (#712)"
    options:
      method: set_anim_curve_keys
  animation.apply_animation_modifier:
    class_path: ue-mcp.bridge
    group: animation
    description: "Instantiate a UAnimationModifier subclass and run it on an AnimSequence. Headline use: modifierClass='DistanceCurveModifier' bakes a Distance curve from the clip's root motion for distance matching (needs root motion baked first - see bake_root_motion_from_bone). Registers the modifier on the sequence so it re-applies on reimport. props sets the modifier's EditAnywhere fields (e.g. DistanceCurveModifier: {CurveName, Axis:'XY'|'X'|..., bStopAtEnd, StopSpeedThreshold, SampleRate}). Note: DistanceCurveModifier ships in the 'Animation Locomotion Library' plugin (off by default) - enable it first. Params: assetPath, modifierClass (short name or /Script path), props? (#712)"
    options:
      method: apply_animation_modifier
  animation.set_montage_slot:
    class_path: ue-mcp.bridge
    group: animation
    description: "Set slot name on a montage track. Params: assetPath, slotName, trackIndex?"
    options:
      method: set_montage_slot
  animation.add_montage_section:
    class_path: ue-mcp.bridge
    group: animation
    description: "Add composite section to montage. Params: assetPath, sectionName, startTime?, linkedSection?"
    options:
      method: add_montage_section
  animation.create_ik_rig:
    class_path: ue-mcp.bridge
    group: animation
    description: "Create IKRigDefinition asset, optionally with retargetRoot + chains[]. Params: name, skeletalMeshPath, packagePath?, retargetRoot?, chains?: [{name, startBone, endBone, goal?}]"
    options:
      method: create_ik_rig
  animation.read_ik_rig:
    class_path: ue-mcp.bridge
    group: animation
    description: "Read IK Rig chains, solvers, skeleton. Params: assetPath"
    options:
      method: read_ik_rig
  animation.list_control_rig_variables:
    class_path: ue-mcp.bridge
    group: animation
    description: "List ControlRig variables and hierarchy. Params: assetPath"
    options:
      method: list_control_rig_variables
  animation.read_control_rig_graph:
    class_path: ue-mcp.bridge
    group: animation
    description: "Read a Control Rig's RigVM models: every graph with its nodes (name, node path, class), each node's pins (name, pin path, cppType, direction, execute flag, default value, nested sub-pins) and the links between them, plus full member-variable metadata (type, subtype, array-ness, default, public/read-only). list_control_rig_variables only ever reported a node COUNT, which is not enough to verify solver wiring (#774). Params: assetPath, graphName? (substring filter), includePins? (default true), includeDefaults? (default true), includeLinks? (default true), limit? (nodes per graph, default 200)"
    options:
      method: read_control_rig_graph
  animation.read_control_rig_hierarchy:
    class_path: ue-mcp.bridge
    group: animation
    description: "Read a Control Rig's per-element hierarchy metadata: each element's name, type (Bone|Control|Null|Curve...), index, and parent. Params: assetPath (#619)"
    options:
      method: read_control_rig_hierarchy
  animation.set_root_motion:
    class_path: ue-mcp.bridge
    group: animation
    description: "Set root motion settings on AnimSequence. Params: assetPath, enableRootMotion?, forceRootLock?, useNormalizedRootMotionScale?, rootMotionRootLock?"
    options:
      method: set_root_motion_settings
  animation.add_virtual_bone:
    class_path: ue-mcp.bridge
    group: animation
    description: "Add virtual bone. Params: skeletonPath, sourceBone, targetBone"
    options:
      method: add_virtual_bone
  animation.remove_virtual_bone:
    class_path: ue-mcp.bridge
    group: animation
    description: "Remove virtual bone. Params: skeletonPath, virtualBoneName"
    options:
      method: remove_virtual_bone
  animation.create_composite:
    class_path: ue-mcp.bridge
    group: animation
    description: "Create AnimComposite. Params: name, skeletonPath, packagePath?"
    options:
      method: create_anim_composite
  animation.list_modifiers:
    class_path: ue-mcp.bridge
    group: animation
    description: "List applied animation modifiers. Params: assetPath"
    options:
      method: list_anim_modifiers
  animation.create_ik_retargeter:
    class_path: ue-mcp.bridge
    group: animation
    description: "Create IKRetargeter asset and (default) initialize the UE 5.7 ops stack: assigns sourceRig+targetRig to all ops, runs AutoMapChains. Returns chainsMapped count. Params: name, packagePath?, sourceRig?, targetRig?, autoMapChains? (default true) (#246)"
    options:
      method: create_ik_retargeter
  animation.read_ik_retargeter:
    class_path: ue-mcp.bridge
    group: animation
    description: "Read IKRetargeter: source/target rigs and chain mappings. Params: assetPath (#246)"
    options:
      method: read_ik_retargeter
  animation.set_ik_rig_mesh:
    class_path: ue-mcp.bridge
    group: animation
    description: "Set the preview/source skeletal mesh on an EXISTING IK Rig. Params: rigPath, meshPath (#701)"
    options:
      method: set_ik_rig_mesh
  animation.set_ik_retargeter_rig:
    class_path: ue-mcp.bridge
    group: animation
    description: "Set the source or target IK Rig on an EXISTING IK Retargeter. Params: retargeterPath, rigPath, side? (source|target, default target) (#703)"
    options:
      method: set_ik_retargeter_rig
  animation.auto_align_retarget_pose:
    class_path: ue-mcp.bridge
    group: animation
    description: "Auto-align all bones of the source/target retarget pose (chain-to-chain) - fixes a retargeter that outputs a static reference pose. Params: retargeterPath, side? (source|target, default target) (#701)"
    options:
      method: auto_align_retarget_pose
  animation.reset_retarget_pose:
    class_path: ue-mcp.bridge
    group: animation
    description: "Reset the current retarget pose (all bones) to the reference pose. Params: retargeterPath, side? (source|target, default target) (#701)"
    options:
      method: reset_retarget_pose
  animation.batch_retarget_animations:
    class_path: ue-mcp.bridge
    group: animation
    description: "Bake a set of source AnimSequences onto the target skeleton through an IK Retargeter (RunBatchRetarget). Params: retargeterPath, sourceMesh, targetMesh, animPaths[], outputPath? (default: alongside source), prefix?, suffix? (default _Retargeted), overwrite? (#701)"
    options:
      method: batch_retarget_animations
  animation.set_anim_blueprint_skeleton:
    class_path: ue-mcp.bridge
    group: animation
    description: "Set target skeleton on AnimBP. Params: assetPath, skeletonPath"
    options:
      method: set_anim_blueprint_skeleton
  animation.read_bone_track:
    class_path: ue-mcp.bridge
    group: animation
    description: "Read bone transform samples from AnimSequence. Params: assetPath, boneName, frames?: [int]"
    options:
      method: read_bone_track
  animation.create_pose_search_database:
    class_path: ue-mcp.bridge
    group: animation
    description: "Create a PoseSearchDatabase asset (motion matching). Params: name, packagePath?, schemaPath?"
    options:
      method: create_pose_search_database
  animation.set_pose_search_schema:
    class_path: ue-mcp.bridge
    group: animation
    description: "Set the Schema on an existing PoseSearchDatabase. Params: assetPath, schemaPath"
    options:
      method: set_pose_search_schema
  animation.add_pose_search_sequence:
    class_path: ue-mcp.bridge
    group: animation
    description: "Append an AnimSequence/AnimComposite/AnimMontage/BlendSpace to a PoseSearchDatabase, with optional per-clip flags. Params: assetPath, sequencePath, mirror? ('original'|'mirrored'|'both'), disableReselection?, sampleStart?, sampleEnd?, enabled? (#684)"
    options:
      method: add_pose_search_sequence
  animation.set_pose_search_clips:
    class_path: ue-mcp.bridge
    group: animation
    description: "Author the whole clip list of a PoseSearchDatabase in one call (the 'duplicate a stock PSD, swap its clips' pipeline step). Replaces the list by default. Each clip carries per-entry flags. Params: assetPath, clips ([{sequencePath, mirror? ('original'|'mirrored'|'both'), disableReselection?, sampleStart?, sampleEnd?, enabled?}] - a bare string path also works), clearExisting? (default true). Follow with build_pose_search_index (#684)"
    options:
      method: set_pose_search_clips
  animation.build_pose_search_index:
    class_path: ue-mcp.bridge
    group: animation
    description: "Build (or rebuild) the search index. Params: assetPath, wait? (default true)"
    options:
      method: build_pose_search_index
  animation.read_pose_search_database:
    class_path: ue-mcp.bridge
    group: animation
    description: "Inspect a PoseSearchDatabase: schema, animation entries, cost biases, tags. Params: assetPath"
    options:
      method: read_pose_search_database
  animation.set_pose_search_database_settings:
    class_path: ue-mcp.bridge
    group: animation
    description: "Tune a PoseSearchDatabase: cost biases, KD-tree neighbours, search mode, PCA components, normalization set. Params: assetPath, continuingPoseCostBias?, baseCostBias?, loopingCostBias?, kdTreeQueryNumNeighbors?, numberOfPrincipalComponents?, poseSearchMode? ('bruteforce'|'pcakdtree'|'vptree'|'eventonly'), normalizationSetPath? (motion matching)"
    options:
      method: set_pose_search_database_settings
  animation.create_pose_search_schema:
    class_path: ue-mcp.bridge
    group: animation
    description: "Create a PoseSearchSchema (the feature definition a database indexes against). Binds a skeleton (and optional mirror table) and, by default, adds Trajectory+Pose default channels so the schema is immediately buildable. Refine with add_pose_search_schema_*_channel. Params: name, skeletonPath, packagePath?, mirrorDataTablePath?, sampleRate?, addDefaultChannels? (default true) (motion matching)"
    options:
      method: create_pose_search_schema
  animation.add_pose_search_schema_pose_channel:
    class_path: ue-mcp.bridge
    group: animation
    description: "Add a Pose feature channel to a schema (samples named bones for velocity/position/rotation/phase). Params: schemaPath, bones ([{bone, flags?:['velocity','position','rotation','phase'], weight?}] - a bare bone-name string defaults to position), weight? (motion matching)"
    options:
      method: add_pose_search_schema_pose_channel
  animation.add_pose_search_schema_trajectory_channel:
    class_path: ue-mcp.bridge
    group: animation
    description: "Add a Trajectory feature channel to a schema (past/future motion samples). Params: schemaPath, samples ([{offset (seconds; negative=history, positive=prediction), flags?:['position','velocity','facingDirection','velocityDirection', ...XY variants], weight?}]), weight? (motion matching)"
    options:
      method: add_pose_search_schema_trajectory_channel
  animation.read_pose_search_schema:
    class_path: ue-mcp.bridge
    group: animation
    description: "Inspect a PoseSearchSchema: skeleton(s), mirror table, sample rate, feature channels. Params: schemaPath (motion matching)"
    options:
      method: read_pose_search_schema
  animation.create_mirror_data_table:
    class_path: ue-mcp.bridge
    group: animation
    description: "Create a MirrorDataTable for a skeleton (needed for mirrored poses in motion matching / mirror nodes). Auto-derives bone-pair rows from find/replace expressions (defaults to UE mannequin _l/_r suffix swap). Params: name, skeletonPath, packagePath?, expressions? ([{find, replace, method?:'suffix'|'prefix'|'regex'}]), mirrorAxis? (X|Y|Z, default X), mirrorRootMotion? (default true)"
    options:
      method: create_mirror_data_table
  animation.read_mirror_data_table:
    class_path: ue-mcp.bridge
    group: animation
    description: "Inspect a MirrorDataTable: skeleton and bone-pair rows (name -> mirroredName). Params: assetPath (motion matching)"
    options:
      method: read_mirror_data_table
  animation.create_pose_search_normalization_set:
    class_path: ue-mcp.bridge
    group: animation
    description: "Create a PoseSearchNormalizationSet grouping databases so they normalize their cost space together (consistent blending across a locomotion set). Assign it via set_pose_search_database_settings(normalizationSetPath). Params: name, packagePath?, databases? ([PoseSearchDatabase paths]) (motion matching)"
    options:
      method: create_pose_search_normalization_set
  animation.add_motion_matching_node:
    class_path: ue-mcp.bridge
    group: animation
    description: "Add a Motion Matching node to an AnimBP AnimGraph and point it at a PoseSearchDatabase (the runtime node that searches the database each frame). Connects its output to the Output Pose by default. For chooser-driven database selection, bind an anim-node function that calls SetDatabasesToSearch. Params: assetPath (AnimBP), databasePath, graphName? (default AnimGraph), connectToOutput? (default true), blendTime? (motion matching)"
    options:
      method: add_motion_matching_node
  animation.add_pose_history_node:
    class_path: ue-mcp.bridge
    group: animation
    description: "Add a Pose History (PoseSearchHistoryCollector) node to an AnimBP AnimGraph - the Motion Matching node needs it in the graph to query pose/trajectory history. Defaults to self-generated trajectory (no external trajectory pin needed) and inserts itself into the pose chain feeding the Output Pose. Params: assetPath (AnimBP), graphName? (default AnimGraph), poseCount?, samplingInterval?, generateTrajectory? (default true), trajectoryHistoryCount?, trajectoryPredictionCount?, insertBeforeOutput? (default true) (motion matching)"
    options:
      method: add_pose_history_node
  animation.set_motion_matching_chooser:
    class_path: ue-mcp.bridge
    group: animation
    description: "Drive the Motion Matching node's Database from a ChooserTable so the database is selected at runtime by character state. Wires a thread-safe EvaluateChooser (result typed to PoseSearchDatabase) into the MM node's Database pin. contextSource selects what the chooser reads its columns from: 'self' (default, the anim instance - choosers branching on AnimBP variables) or 'pawn' (the owning pawn via TryGetPawnOwner - choosers branching on character/pawn state). Params: assetPath (AnimBP), chooserPath (ChooserTable), graphName? (default AnimGraph), contextSource? ('self'|'pawn') (motion matching)"
    options:
      method: set_motion_matching_chooser
  animation.add_sequence_evaluator:
    class_path: ue-mcp.bridge
    group: animation
    description: "Add a Sequence Evaluator node (explicit-time player) to an AnimBP graph - the node distance matching drives by setting its ExplicitTime each frame. graphName can be the top-level AnimGraph or a state's inner graph (pass the state name). Defaults bTeleportToExplicitTime=false so time advances and root motion extracts. Connects to the Output Pose by default. Returns nodeGuid for bind_anim_node_function. Params: assetPath (AnimBP), sequencePath? (AnimSequence to evaluate), graphName? (default AnimGraph), explicitTime?, shouldLoop?, teleportToExplicitTime? (default false), connectToOutput? (default true) (#713)"
    options:
      method: add_sequence_evaluator
  animation.bind_anim_node_function:
    class_path: ue-mcp.bridge
    group: animation
    description: "Bind a thread-safe anim-node function to an anim graph node's update slot - the mechanism distance matching uses to advance a Sequence Evaluator's explicit time each frame (function calls AnimDistanceMatchingLibrary::DistanceMatchToTarget / AdvanceTimeByDistanceMatching). The function must already exist on the AnimBP (create it as a BlueprintThreadSafe function first). Identify the node by nodeGuid (from add_sequence_evaluator / add_*_node). Params: assetPath (AnimBP), nodeGuid, functionName, graphName? (default AnimGraph), binding? ('update' (default)|'becomeRelevant'|'initialUpdate') (#713)"
    options:
      method: bind_anim_node_function
  animation.set_sequence_properties:
    class_path: ue-mcp.bridge
    group: animation
    description: "Batch-set properties on AnimSequence assets. If a path is a Montage and resolveFromMontages is true (default), resolves to its first AnimSequence. Params: assetPaths[], properties{enableRootMotion?, forceRootLock?, useNormalizedRootMotionScale?, rootMotionRootLock?}, resolveFromMontages?"
    options:
      method: set_sequence_properties
  animation.bake_root_motion_from_bone:
    class_path: ue-mcp.bridge
    group: animation
    description: "Bake delta translation from a source bone (e.g. pelvis) onto the root bone across the whole sequence; compensates the source bone so world-space position is unchanged. Params: assetPath, sourceBone, rootBone? (default 'root'), axes? (default ['x','y']), interpolation? ('linear'|'per_frame', default 'linear')"
    options:
      method: bake_root_motion_from_bone
  animation.get_bone_transform:
    class_path: ue-mcp.bridge
    group: animation
    description: "Read a bone or socket transform on a live actor's SkeletalMeshComponent. Wraps GetBoneTransform / GetSocketTransform. Params: actorLabel, boneName (or socket name), componentName? (default: CharacterMesh0 / Mesh / first SK component), world? (auto|pie|game|editor, default auto), space? (world|component|local, default world). Returns location, rotation, scale (#420)"
    options:
      method: get_bone_transform
  animation.list_bones:
    class_path: ue-mcp.bridge
    group: animation
    description: "List bones in a live actor's SkeletalMeshComponent ref skeleton (name, index, parent). Params: actorLabel, componentName?, world? (auto|pie|game|editor, default auto) (#420)"
    options:
      method: list_bones
  animation.rebind_leader_pose:
    class_path: ue-mcp.bridge
    group: animation
    description: "Re-bind every secondary SkeletalMeshComponent on an actor to a body component (default CharacterMesh0 / Mesh). One-call fix for the 'character explodes after rotating the actor' failure mode. Params: actorLabel, bodyComponent? (#419)"
    options:
      method: rebind_leader_pose
  animation.preview_animation:
    class_path: ue-mcp.bridge
    group: animation
    description: "Toggle bUpdateAnimationInEditor + VisibilityBasedAnimTickOption=AlwaysTickPoseAndRefreshBones on every SkeletalMeshComponent of an actor. Bypasses the 'cannot be edited on templates' guard for level instances. Params: actorLabel, enabled (#419/#420)"
    options:
      method: preview_animation

  # ── landscape ──
  landscape.get_info:
    class_path: ue-mcp.bridge
    group: landscape
    description: Get landscape setup
    options:
      method: get_landscape_info
  landscape.list_layers:
    class_path: ue-mcp.bridge
    group: landscape
    description: List paint layers
    options:
      method: list_landscape_layers
  landscape.sample:
    class_path: ue-mcp.bridge
    group: landscape
    description: "Sample height/layers. Params: x, y"
    options:
      method: sample_landscape
  landscape.sculpt:
    class_path: ue-mcp.bridge
    group: landscape
    description: "Raise, lower or flatten terrain with a circular brush. mode=raise|lower|flatten; amount is world centimetres at full strength (raise/lower), and flatten pulls toward the height under the brush centre. falloff (0..1) is the smoothstepped soft edge. Runs in one transaction and leaves the level dirty and unsaved. Writes into an edit layer (editLayer by name, else editLayerIndex, default 0) - required on UE 5.8, where a write without one is regenerated away by the layer system. Params: center ({x,y} world space), radius (default 500), mode? (default raise), amount? (default 100), falloff? (default 0.5), actorLabel?, editLayer?, editLayerIndex?, maxVertices? (#742)"
    options:
      method: sculpt_landscape
  landscape.paint_layer:
    class_path: ue-mcp.bridge
    group: landscape
    description: "Paint a weight layer with a circular brush. The layer must already have a LayerInfo on this landscape (see add_layer_info) - an unregistered name errors and lists the layers that ARE registered instead of silently painting nothing. Weights are written as given - the engine no longer renormalises other layers for you, so set them explicitly if they must sum to 1. Writes into an edit layer (editLayer by name, else editLayerIndex, default 0). Params: layerName, center ({x,y} world space), radius (default 500), strength? (0..1, default 1), falloff? (default 0.5), actorLabel?, editLayer?, editLayerIndex?, maxVertices? (#742)"
    options:
      method: paint_landscape_layer
  landscape.list_splines:
    class_path: ue-mcp.bridge
    group: landscape
    description: Read landscape splines
    options:
      method: list_landscape_splines
  landscape.get_component:
    class_path: ue-mcp.bridge
    group: landscape
    description: "Inspect component. Params: componentIndex"
    options:
      method: get_landscape_component
  landscape.set_material:
    class_path: ue-mcp.bridge
    group: landscape
    description: "Set landscape material. Params: materialPath"
    options:
      method: set_landscape_material
  landscape.add_layer_info:
    class_path: ue-mcp.bridge
    group: landscape
    description: "Register paint layer (creates LayerInfo asset + binds to active landscape). Params: layerName, packagePath?"
    options:
      method: add_landscape_layer_info
  landscape.create_layer_info:
    class_path: ue-mcp.bridge
    group: landscape
    description: "Standalone LayerInfo asset creation - no landscape required. Params: layerName, name? (default LI_<layerName>), packagePath? (default /Game/Landscape/LayerInfos), physMaterial? (asset path), hardness? (#251)"
    options:
      method: create_landscape_layer_info
  landscape.create:
    class_path: ue-mcp.bridge
    group: landscape
    description: "Spawn a new ALandscape with a flat heightmap. Defaults match the Editor's Landscape Mode 'create new' (8x8 components, 63 quads/subsection, 2 subsections/component = 1016x1016 quads). Params: location? (Vec3), scale? (Vec3, default 100,100,100), componentCountX? (default 8), componentCountY? (default 8), subsectionSizeQuads? (one of 7|15|31|63|127|255, default 63), numSubsections? (1|2, default 2), heightOffset? (uint16, default 32768 = mid-elevation), label? (#303)"
    options:
      method: create_landscape
  landscape.get_material_usage_summary:
    class_path: ue-mcp.bridge
    group: landscape
    description: "Per-proxy summary: landscape/hole material paths + component/grass/nanite counts (#150)"
    options:
      method: get_landscape_material_usage_summary
  landscape.list_proxies:
    class_path: ue-mcp.bridge
    group: landscape
    description: "Enumerate loaded World Partition LandscapeStreamingProxy actors with per-proxy worldBounds (origin/extent), plus loadedProxies + parentLandscapes counts. Unloaded proxies are not spawned as actors, so only loaded ones appear - use this to confirm a proxy is streamed in before trusting a layer/height readback (#733)"
    options:
      method: list_landscape_proxies
  landscape.find_proxy_at:
    class_path: ue-mcp.bridge
    group: landscape
    description: "Resolve which loaded LandscapeStreamingProxy covers a world X/Y. Returns found/loaded + label, or loaded:false when the covering proxy is streamed out (so a 0-weight readback there is ambiguous, not real). Params: worldX, worldY (#733)"
    options:
      method: find_landscape_proxy_at

