  networking.set_property_replicated:
    class_path: ue-mcp.bridge
    group: networking
    description: "Mark a Blueprint variable as replicated. replicationType is 'None' | 'Replicated' | 'RepNotify'; repNotify=true is shorthand for RepNotify and replicated=true for Replicated. Params: blueprintPath, variableName (alias: propertyName), replicationType? | replicated? | repNotify? (#768)"
    options:
      method: set_property_replicated
  networking.configure_net_frequency:
    class_path: ue-mcp.bridge
    group: networking
    description: "Set update frequency. Params: blueprintPath, netUpdateFrequency?, minNetUpdateFrequency?"
    options:
      method: configure_net_update_frequency
  networking.set_dormancy:
    class_path: ue-mcp.bridge
    group: networking
